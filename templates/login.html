<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso - Archivo Municipal de Maracaibo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex flex-column vh-100 justify-content-between" style="background: linear-gradient(135deg, #090d16 0%, #1a253a 100%);">
    <div class="container d-flex align-items-center justify-content-center my-auto">
        <div class="card shadow-lg border-0 rounded-4 p-4" style="width: 100%; max-width: 440px; background-color: #ffffff;">
            <div class="text-center mb-4">
                <div class="mb-3 d-flex justify-content-center align-items-center">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" id="mainLogo" alt="Logo" style="height: 65px;" class="bg-dark rounded p-2 shadow-sm">
                </div>
                <h3 class="fw-bold text-dark mb-1">Archivo Municipal de Maracaibo</h3>
                <p class="text-muted small">Concejo Municipal Bolivariano de Maracaibo</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary small">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 fw-bold shadow-sm" style="background-color: #0f172a;"><i class="bi bi-box-arrow-in-right me-2"></i> Ingresar al Sistema</button>
            </form>
        </div>
    </div>
    <footer class="text-center py-3 text-light small border-top border-secondary bg-transparent">
        <p class="mb-1 fw-medium" style="font-size: 0.8rem;">Creado Concejo Municipal Bolivariano de Maracaibo &copy; 2026 - Toda la Gloria es para Dios</p>
        <p class="mb-0 fst-italic text-warning" style="font-size: 0.75rem;">"{{ versiculo_texto }}" — {{ versiculo_ref }}</p>
    </footer>
    <script>
        document.getElementById('mainLogo').addEventListener('error', function() {
            this.outerHTML = '<div class="bg-dark rounded p-2 shadow-sm d-inline-block"><i class="bi bi-bank fs-1 text-warning"></i></div>';
        });
    </script>
</body>
</html>
